{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<h2>Login</h2>
<form method="post">
  <input class="form-control mb-3" name="email" type="email" placeholder="College email" required>
  <input class="form-control mb-3" name="password" type="password" placeholder="Password" required>
  <button class="btn btn-primary">Login</button>
</form>
<p class="mt-3">New user? <a href="{{ url_for('auth.register') }}">Register</a></p>
{% endblock %}
