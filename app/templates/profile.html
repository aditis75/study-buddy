{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<h2>My Profile</h2>
<form method="post">
  <input class="form-control mb-3" name="name" value="{{ current_user.name }}" placeholder="Name" required>
  <input class="form-control mb-3" name="department" value="{{ current_user.department or '' }}" placeholder="Department">
  <input class="form-control mb-3" name="year" type="number" value="{{ current_user.year or '' }}" placeholder="Year">
  <input class="form-control mb-3" name="subjects" value="{{ current_user.subjects or '' }}" placeholder="Subjects, comma separated">
  <textarea class="form-control mb-3" name="study_preferences" placeholder="Study preferences">{{ current_user.study_preferences or '' }}</textarea>
  <textarea class="form-control mb-3" name="availability" placeholder="Availability">{{ current_user.availability or '' }}</textarea>
  <textarea class="form-control mb-3" name="interests" placeholder="Interests">{{ current_user.interests or '' }}</textarea>
  <button class="btn btn-primary">Save Profile</button>
</form>
{% endblock %}
