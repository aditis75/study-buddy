{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<h2>Create Account</h2>
<form method="post">
  <input class="form-control mb-3" name="name" placeholder="Name" required>
  <input class="form-control mb-3" name="email" type="email" placeholder="MIT-WPU email" required>
  <input class="form-control mb-3" name="department" placeholder="Department" required>
  <input class="form-control mb-3" name="year" type="number" min="1" max="6" placeholder="Year" required>
  <input class="form-control mb-3" name="password" type="password" placeholder="Password" required>
  <button class="btn btn-primary">Register</button>
</form>
{% endblock %}
