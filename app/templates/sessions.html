{% extends "base.html" %}
{% block title %}Study Sessions{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Study Sessions</h2>
  <a class="btn btn-primary" href="{{ url_for('study_sessions.create') }}">Create Session</a>
</div>
{% for s in sessions %}
<div class="card mb-3">
  <div class="card-body">
    <h5>{{ s.subject }}</h5>
    <p>{{ s.date }} at {{ s.time }} · {{ s.venue }}</p>
    <a href="{{ url_for('study_sessions.detail', sid=s.id) }}" class="btn btn-outline-primary">View</a>
  </div>
</div>
{% else %}
<p>No active sessions yet.</p>
{% endfor %}
{% endblock %}
